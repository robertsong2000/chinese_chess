services:
  chinese-chess:
    image: nginx:1.27-alpine
    container_name: chinese-chess
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./src:/usr/share/nginx/html/src:ro
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
